[workspace]
resolver = "3"
members = [
    "crates/bot-logic",
    "crates/bot-core",
    "crates/bot-scenario",
    "crates/riichilab-client",
    "crates/chiihou-client",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
nostr-sdk = "=0.44.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
