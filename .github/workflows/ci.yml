name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        run: rustup toolchain install --no-self-update

      - name: Compute Rust cache key
        id: rust-key
        run: |
          echo "rustc=$(rustc -Vv | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Restore Cargo cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-v2-lint-${{ steps.rust-key.outputs.rustc }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-v2-lint-${{ steps.rust-key.outputs.rustc }}-
            ${{ runner.os }}-${{ runner.arch }}-cargo-v1-${{ steps.rust-key.outputs.rustc }}-

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        env:
          CARGO_BUILD_WARNINGS: deny
        run: cargo clippy --locked --all-targets --all-features --keep-going

      - name: Save Cargo cache
        if: >-
          success() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  test:
    name: test / ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: bot-logic
            args: -p bot-logic
          - name: clients
            args: -p chiihou-client -p riichilab-client
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        run: rustup toolchain install --no-self-update

      - name: Compute Rust cache key
        id: rust-key
        run: |
          echo "rustc=$(rustc -Vv | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Restore Cargo cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-v2-${{ matrix.name }}-${{ steps.rust-key.outputs.rustc }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-v2-${{ matrix.name }}-${{ steps.rust-key.outputs.rustc }}-
            ${{ runner.os }}-${{ runner.arch }}-cargo-v1-${{ steps.rust-key.outputs.rustc }}-

      - name: Test
        run: cargo test --locked ${{ matrix.args }}

      - name: Save Cargo cache
        if: >-
          success() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  test-bot-core:
    name: test / bot-core (${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        run: rustup toolchain install --no-self-update

      - name: Set up cargo-nextest
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: cargo-nextest@0.9.143

      - name: Compute Rust cache key
        id: rust-key
        run: |
          echo "rustc=$(rustc -Vv | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Restore Cargo cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-v2-bot-core-${{ steps.rust-key.outputs.rustc }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-v2-bot-core-${{ steps.rust-key.outputs.rustc }}-
            ${{ runner.os }}-${{ runner.arch }}-cargo-v1-${{ steps.rust-key.outputs.rustc }}-

      - name: Test
        run: cargo nextest run --locked --no-fail-fast -p bot-core --partition slice:${{ matrix.shard }}/8

      - name: Doctest
        if: matrix.shard == 1
        run: cargo test --locked -p bot-core --doc

      - name: Save Cargo cache
        if: >-
          success() &&
          matrix.shard == 1 &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  test-bot-scenario:
    name: test / bot-scenario (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        run: rustup toolchain install --no-self-update

      - name: Set up cargo-nextest
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: cargo-nextest@0.9.143

      - name: Compute Rust cache key
        id: rust-key
        run: |
          echo "rustc=$(rustc -Vv | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Restore Cargo cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-v2-bot-scenario-${{ steps.rust-key.outputs.rustc }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-v2-bot-scenario-${{ steps.rust-key.outputs.rustc }}-
            ${{ runner.os }}-${{ runner.arch }}-cargo-v1-${{ steps.rust-key.outputs.rustc }}-

      - name: Test
        run: cargo nextest run --locked --no-fail-fast -p bot-scenario --partition slice:${{ matrix.shard }}/4

      - name: Save Cargo cache
        if: >-
          success() &&
          matrix.shard == 1 &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
